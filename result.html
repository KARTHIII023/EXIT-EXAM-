<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prediction result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="shell result-shell">
        <section class="result-card">
            <p class="eyebrow">Model prediction</p>
            <h1>Your result is<br><em>{{ prediction|title }}</em></h1>
            {% if probability is not none %}
                <div class="confidence"><span>Confidence</span><strong>{{ '%.1f'|format(probability * 100) }}%</strong></div>
            {% endif %}
            <a class="back-link" href="{{ url_for('index') }}">← Try another profile</a>
        </section>
    </main>
</body>
</html>
